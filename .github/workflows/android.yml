name: Android Offline Build

on:
  push:
    branches: [feat/android-offline-pantomime]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Offline validation
        working-directory: mobile
        run: npm test
      - name: Build offline React assets
        working-directory: mobile
        run: npm run build
      - name: Generate Android project
        working-directory: mobile
        run: |
          npx cap add android
          npm run android:configure
      - name: Restore optional release keystore
        working-directory: mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.PANTOMIME_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf "%s" "$KEYSTORE_BASE64" | base64 -d > release.jks
          fi
      - name: Build debug and release
        working-directory: mobile/android
        env:
          PANTOMIME_KEYSTORE_PATH: ${{ github.workspace }}/mobile/release.jks
          PANTOMIME_KEYSTORE_PASSWORD: ${{ secrets.PANTOMIME_KEYSTORE_PASSWORD }}
          PANTOMIME_KEY_ALIAS: ${{ secrets.PANTOMIME_KEY_ALIAS }}
          PANTOMIME_KEY_PASSWORD: ${{ secrets.PANTOMIME_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
      - name: Export debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pantomime-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
      - name: Export release binaries
        uses: actions/upload-artifact@v4
        with:
          name: pantomime-release-binaries
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab
      - name: Pack standalone Android source
        run: |
          cd mobile
          zip -qr ../pantomime-android-project.zip . -x 'node_modules/*' 'android/.gradle/*' 'android/app/build/*' 'android/build/*' 'android/.idea/*' 'release.jks' '.env*' 'android/local.properties'
      - name: Export Android project
        uses: actions/upload-artifact@v4
        with:
          name: pantomime-android-project
          path: pantomime-android-project.zip
